name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Official Gradle 8.5
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-MiBox-Launcher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
